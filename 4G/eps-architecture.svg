<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #2b6cb0; stroke-width: 2; rx: 8; }
    .core-box { fill: #ebf4ff; stroke: #2b6cb0; stroke-width: 2; rx: 8; }
    .ran-box { fill: #f0fff4; stroke: #2f855a; stroke-width: 2; rx: 8; }
    .ext-box { fill: #fffaf0; stroke: #c05621; stroke-width: 2; rx: 8; }
    .label { font-size: 14px; fill: #1a202c; font-weight: 600; text-anchor: middle; }
    .sub { font-size: 11px; fill: #4a5568; text-anchor: middle; }
    .link { stroke: #718096; stroke-width: 1.6; fill: none; }
    .link-label { font-size: 11px; fill: #2d3748; text-anchor: middle; }
    .group-label { font-size: 15px; fill: #2d3748; font-weight: 700; }
  </style>

  <!-- UE -->
  <rect x="30" y="250" width="100" height="60" class="box"/>
  <text x="80" y="275" class="label">UE</text>
  <text x="80" y="292" class="sub">(your phone)</text>

  <!-- E-UTRAN group -->
  <rect x="190" y="150" width="220" height="260" fill="#f7fafc" stroke="#2f855a" stroke-width="1.5" stroke-dasharray="6,4" rx="10"/>
  <text x="205" y="175" class="group-label" fill="#2f855a">E-UTRAN</text>

  <rect x="220" y="200" width="160" height="60" class="ran-box"/>
  <text x="300" y="225" class="label">eNodeB #1</text>
  <text x="300" y="242" class="sub">base station</text>

  <rect x="220" y="310" width="160" height="60" class="ran-box"/>
  <text x="300" y="335" class="label">eNodeB #2</text>
  <text x="300" y="352" class="sub">base station</text>

  <!-- X2 between eNodeBs -->
  <path d="M300,260 L300,310" class="link" marker-end="url(#arrow)"/>
  <text x="345" y="288" class="link-label">X2</text>

  <!-- Uu -->
  <path d="M130,280 L220,230" class="link" marker-end="url(#arrow)"/>
  <text x="165" y="245" class="link-label">Uu</text>

  <!-- EPC group -->
  <rect x="450" y="60" width="380" height="440" fill="#f7fafc" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="6,4" rx="10"/>
  <text x="465" y="85" class="group-label" fill="#2b6cb0">EPC (Core Network)</text>

  <rect x="480" y="110" width="140" height="60" class="core-box"/>
  <text x="550" y="135" class="label">MME</text>
  <text x="550" y="152" class="sub">control plane</text>

  <rect x="480" y="220" width="140" height="60" class="core-box"/>
  <text x="550" y="245" class="label">S-GW</text>
  <text x="550" y="262" class="sub">user plane anchor</text>

  <rect x="480" y="330" width="140" height="60" class="core-box"/>
  <text x="550" y="355" class="label">P-GW</text>
  <text x="550" y="372" class="sub">internet gateway</text>

  <rect x="660" y="110" width="140" height="60" class="core-box"/>
  <text x="730" y="135" class="label">HSS</text>
  <text x="730" y="152" class="sub">subscriber DB</text>

  <rect x="660" y="330" width="140" height="60" class="core-box"/>
  <text x="730" y="355" class="label">PCRF</text>
  <text x="730" y="372" class="sub">policy / charging</text>

  <!-- eNB to MME (S1-MME) -->
  <path d="M380,220 C 420,200 450,160 480,140" class="link" marker-end="url(#arrow)"/>
  <text x="430" y="175" class="link-label">S1-MME</text>

  <!-- eNB to S-GW (S1-U) -->
  <path d="M380,340 C 420,320 450,270 480,250" class="link" marker-end="url(#arrow)"/>
  <text x="430" y="315" class="link-label">S1-U</text>

  <!-- MME to S-GW -->
  <path d="M550,170 L550,220" class="link" marker-end="url(#arrow)"/>

  <!-- S-GW to P-GW -->
  <path d="M550,280 L550,330" class="link" marker-end="url(#arrow)"/>
  <text x="600" y="308" class="link-label">S5/S8</text>

  <!-- MME to HSS -->
  <path d="M620,140 L660,140" class="link" marker-end="url(#arrow)"/>
  <text x="640" y="130" class="link-label">S6a</text>

  <!-- PGW to PCRF -->
  <path d="M620,360 L660,360" class="link" marker-end="url(#arrow)"/>
  <text x="640" y="350" class="link-label">Gx</text>

  <!-- Internet -->
  <rect x="890" y="330" width="90" height="60" class="ext-box"/>
  <text x="935" y="365" class="label">Internet</text>

  <path d="M620,360 C 750,410 850,410 890,375" class="link" marker-end="url(#arrow)"/>
  <text x="770" y="425" class="link-label">SGi</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#718096"/>
    </marker>
  </defs>

  <text x="500" y="530" class="sub" font-size="12">EPS = E-UTRAN (radio, green) + EPC (core, blue). Control-plane paths shown via MME/HSS; user-plane data flows UE → eNodeB → S-GW → P-GW → Internet.</text>
</svg>
