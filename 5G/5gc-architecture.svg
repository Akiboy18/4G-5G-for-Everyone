<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #6b46c1; stroke-width: 2; rx: 8; }
    .core-box { fill: #faf5ff; stroke: #6b46c1; stroke-width: 2; rx: 8; }
    .ran-box { fill: #f0fff4; stroke: #2f855a; stroke-width: 2; rx: 8; }
    .ext-box { fill: #fffaf0; stroke: #c05621; stroke-width: 2; rx: 8; }
    .bus { fill: #edf2f7; stroke: #4a5568; stroke-width: 1.5; stroke-dasharray: 4,3; }
    .label { font-size: 14px; fill: #1a202c; font-weight: 600; text-anchor: middle; }
    .sub { font-size: 11px; fill: #4a5568; text-anchor: middle; }
    .link { stroke: #718096; stroke-width: 1.6; fill: none; }
    .link-label { font-size: 11px; fill: #2d3748; text-anchor: middle; }
    .group-label { font-size: 15px; fill: #2d3748; font-weight: 700; }
  </style>

  <!-- UE -->
  <rect x="30" y="260" width="100" height="60" class="box"/>
  <text x="80" y="285" class="label">UE</text>
  <text x="80" y="302" class="sub">(5G device)</text>

  <!-- NG-RAN group -->
  <rect x="190" y="160" width="200" height="240" fill="#f7fafc" stroke="#2f855a" stroke-width="1.5" stroke-dasharray="6,4" rx="10"/>
  <text x="205" y="185" class="group-label" fill="#2f855a">NG-RAN</text>

  <rect x="215" y="210" width="150" height="60" class="ran-box"/>
  <text x="290" y="230" class="label">gNB</text>
  <text x="290" y="246" class="sub">CU (RRC/PDCP)</text>
  <text x="290" y="260" class="sub">DU (RLC/MAC/PHY)</text>

  <path d="M130,290 L215,240" class="link" marker-end="url(#arrow3)"/>
  <text x="165" y="255" class="link-label">Uu</text>

  <!-- 5GC bus -->
  <rect x="440" y="120" width="500" height="60" class="bus" rx="10"/>
  <text x="460" y="105" class="group-label" fill="#6b46c1">5GC — Service-Based Architecture (SBA bus)</text>
  <text x="690" y="155" class="sub" font-size="12">All functions expose/consume APIs over this common bus</text>

  <!-- functions hanging off bus -->
  <rect x="440" y="220" width="120" height="55" class="core-box"/>
  <text x="500" y="242" class="label">AMF</text>
  <text x="500" y="258" class="sub">access/mobility</text>

  <rect x="580" y="220" width="120" height="55" class="core-box"/>
  <text x="640" y="242" class="label">SMF</text>
  <text x="640" y="258" class="sub">session mgmt</text>

  <rect x="720" y="220" width="120" height="55" class="core-box"/>
  <text x="780" y="242" class="label">UDM</text>
  <text x="780" y="258" class="sub">subscriber data</text>

  <rect x="860" y="220" width="110" height="55" class="core-box"/>
  <text x="915" y="242" class="label">AUSF</text>
  <text x="915" y="258" class="sub">authentication</text>

  <rect x="440" y="310" width="120" height="55" class="core-box"/>
  <text x="500" y="332" class="label">PCF</text>
  <text x="500" y="348" class="sub">policy/charging</text>

  <rect x="580" y="310" width="120" height="55" class="core-box"/>
  <text x="640" y="332" class="label">NSSF</text>
  <text x="640" y="348" class="sub">slice selection</text>

  <!-- vertical connectors from functions up to bus -->
  <path d="M500,220 L500,180" class="link"/>
  <path d="M640,220 L640,180" class="link"/>
  <path d="M780,220 L780,180" class="link"/>
  <path d="M915,220 L915,180" class="link"/>
  <path d="M500,310 L500,275" class="link" stroke-dasharray="3,3"/>
  <path d="M640,310 L640,275" class="link" stroke-dasharray="3,3"/>

  <!-- gNB to AMF (N2) -->
  <path d="M365,225 C 400,190 420,190 440,235" class="link" marker-end="url(#arrow3)"/>
  <text x="400" y="200" class="link-label">N2</text>

  <!-- UPF - separate, user plane -->
  <rect x="440" y="400" width="140" height="60" class="core-box"/>
  <text x="510" y="425" class="label">UPF</text>
  <text x="510" y="442" class="sub">user plane (data)</text>

  <!-- gNB to UPF (N3) -->
  <path d="M365,255 C 400,320 420,370 440,420" class="link" marker-end="url(#arrow3)"/>
  <text x="400" y="340" class="link-label">N3</text>

  <!-- SMF to UPF (N4) -->
  <path d="M640,275 L520,400" class="link" marker-end="url(#arrow3)" stroke-dasharray="3,3"/>
  <text x="600" y="345" class="link-label">N4 (control)</text>

  <!-- UPF to internet -->
  <rect x="700" y="400" width="100" height="60" class="ext-box"/>
  <text x="750" y="425" class="label">Internet</text>
  <text x="750" y="442" class="sub">/ Data Network</text>
  <path d="M580,430 L700,430" class="link" marker-end="url(#arrow3)"/>
  <text x="640" y="420" class="link-label">N6</text>

  <defs>
    <marker id="arrow3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#718096"/>
    </marker>
  </defs>

  <text x="500" y="530" class="sub" font-size="12">5GC functions are software services on a common API bus (SBA), not fixed hardware wiring like LTE's EPC. UPF carries user data; everything else is control-plane signaling.</text>
</svg>
